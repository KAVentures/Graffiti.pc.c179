name: Reproduce conjectures 161 and 162
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: |
          set -o pipefail
          python conjectures/c161-c162/verify.py | tee /tmp/observed-161-162.txt
          diff -u conjectures/c161-c162/expected.txt /tmp/observed-161-162.txt
  paper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - working-directory: conjectures/c161-c162
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-c161-c162
          path: conjectures/c161-c162/paper.pdf
