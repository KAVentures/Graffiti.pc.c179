name: Reproduce Graffiti.pc proofs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        conjecture: [c76, c137, c138, c157, c161, c162, c166, c169, c171, c177, c179, c208, c268, c271, c348, c351, c361, c362, c365]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: conjectures/${{ matrix.conjecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: |
          set -o pipefail
          python verification/verify.py | tee /tmp/observed.txt
          diff -u verification/expected.txt /tmp/observed.txt
          python verification/independent.py
  paper:
    strategy:
      fail-fast: false
      matrix:
        conjecture: [c76, c137, c138, c157, c161, c162, c166, c169, c171, c177, c179, c208, c268, c271, c348, c351, c361, c362, c365]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - working-directory: conjectures/${{ matrix.conjecture }}/paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-${{ matrix.conjecture }}
          path: conjectures/${{ matrix.conjecture }}/paper/paper.pdf
  legacy-c179:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          diff -u SOURCES.md conjectures/c179/SOURCES.md
          diff -u requirements.txt conjectures/c179/requirements.txt
          diff -r paper conjectures/c179/paper
          diff -r verification conjectures/c179/verification
  cross-conjecture-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: |
          set -o pipefail
          python audit/audit_all.py | tee /tmp/audit-observed.txt
          diff -u audit/expected.txt /tmp/audit-observed.txt
  catalogue-consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python audit/check_catalogue.py
